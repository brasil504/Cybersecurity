<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My App Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- LEFT SIDE -->
  <div class="left">
    <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" class="logo">

    <h1>See everyday moments from</h1>
    <h1>your <span>close friends.</span></h1>

    <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e" class="preview">
  </div>

  <!-- RIGHT SIDE -->
  <div class="right">
    <h2>My App Login</h2>

    <form id="form">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>

      <button type="submit" class="login">Log in</button>
      <button type="button" onclick="handleSignup()">Sign Up</button>
    </form>

    <p class="forgot">Forgot password?</p>

    <button class="facebook">Log in with Facebook</button>
    <button class="create">Create new account</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
 <script src="script.js"></script>
</body>
</html>
